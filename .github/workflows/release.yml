name: Release

# Monthly calendar-versioned release. Two gates guard it: the generator or the
# tooling must have changed since the last release, and the organization's
# shared Maven Central budget must have room. A skipped month costs nothing —
# the gate measures against the last release, not the last run, so pending
# changes ride the next slot.
#
# The 8th, because Maven Central meters publishing per organization and that
# budget is shared across every metio repo that publishes there. A weekly slot
# would take most of a month's allowance on its own and quietly starve the
# others. The parent POM releases on the 1st, so taking a slot a week later
# means a release here builds against a parent that already exists.
on:
  schedule:
    - cron: 25 3 8 * *
  workflow_dispatch:

permissions:
  contents: read

# Serialize runs: the gate reads the previous tag before this run creates its
# own, so two runs in flight would emit overlapping notes. Queue, never cancel,
# so the earlier run tags first.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.gate.outputs.needed == 'true' && steps.quota.outputs.available == 'true' }}
      last: ${{ steps.gate.outputs.last }}
      version: ${{ steps.version.outputs.version }}
      timestamp: ${{ steps.version.outputs.timestamp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the gate reads tags and history
      - id: gate
        uses: metio/ci/needs-release@0b7421952e03e7be2aab6ea5ea10721609d12aac # 2026.8.2070928
        with:
          # The examples, the benchmarks and the website ship nothing, so a
          # change confined to them is not worth a release.
          paths: pom.xml yosql-codegen yosql-internals yosql-models yosql-tooling
      - id: quota
        if: steps.gate.outputs.needed == 'true'
        uses: metio/ci/central-quota@0b7421952e03e7be2aab6ea5ea10721609d12aac # 2026.8.2070928
      - id: version
        name: Compute the version and the build timestamp
        if: steps.gate.outputs.needed == 'true'
        # Plain YYYY.M.D rather than the org's second-precision calver: every
        # version published to Central since 2021 has this shape, and a monthly
        # slot cannot collide with itself. The timestamp feeds
        # project.build.outputTimestamp so the jars are byte-reproducible.
        run: |
          set -euo pipefail
          {
            echo "version=$(date --utc +'%Y.%-m.%-d')"
            echo "timestamp=$(date --utc --iso-8601=seconds)"
          } >> "$GITHUB_OUTPUT"

  central:
    # The Maven plugin and everything it is built from. The parent POM's
    # `release` profile carries both halves of the publish: sign-maven-plugin
    # for the PGP signatures Central requires on every file, and
    # central-publishing-maven-plugin for the upload itself.
    name: Maven Central
    needs: [gate]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Set the release version
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: >
          nix develop --command mvn --batch-mode --no-transfer-progress
          --define newVersion="$VERSION"
          --define generateBackupPoms=false
          versions:set
      - name: Write the signing key and the Central credentials
        env:
          GPG_SECRET_KEY_BASE64: ${{ secrets.GPG_SECRET_KEY_BASE64 }}
        run: |
          echo "$GPG_SECRET_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.key.asc"
          # The parent POM publishes through server id "central"; the credentials
          # are read from the environment at deploy time so no secret is written
          # into the settings file itself.
          cat > "$RUNNER_TEMP/settings.xml" <<'XML'
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${env.MAVEN_CENTRAL_USERNAME}</username>
                <password>${env.MAVEN_CENTRAL_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XML
      - name: Publish to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          SIGN_KEY_PASS: ${{ secrets.GPG_SECRET_KEY_PASSWORD }}
          TIMESTAMP: ${{ needs.gate.outputs.timestamp }}
        # Only the Maven plugin and its dependencies. The Ant and CLI
        # distributions ship on the GitHub release, the examples and benchmarks
        # ship nowhere.
        run: >
          nix develop --command mvn --batch-mode --no-transfer-progress
          --settings "$RUNNER_TEMP/settings.xml"
          --activate-profiles release
          --projects yosql-tooling/yosql-tooling-maven --also-make
          --define project.build.outputTimestamp="$TIMESTAMP"
          --define sign.keyFile="$RUNNER_TEMP/signing.key.asc"
          --define sign.keyPass="$SIGN_KEY_PASS"
          deploy

  gradle:
    name: Gradle Plugin Portal
    needs: [gate]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Set the release version
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: >
          nix develop --command mvn --batch-mode --no-transfer-progress
          --define newVersion="$VERSION"
          --define generateBackupPoms=false
          versions:set
      - name: Install the tooling the Gradle plugin builds on
        run: nix develop --command mvn --batch-mode --no-transfer-progress install
      - name: Publish the Gradle plugin
        working-directory: ./yosql-tooling/yosql-tooling-gradle
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: >
          nix develop --command ./gradlew publishPlugins
          -Pversion="$VERSION"
          -Pgradle.publish.key="$PUBLISH_KEY"
          -Pgradle.publish.secret="$PUBLISH_SECRET"

  distributions:
    # The Ant task and the CLI, which are downloaded rather than resolved. Both
    # are built on the runner they target: GraalVM cannot cross-compile, so a
    # native binary needs a runner of its own architecture. Windows is absent
    # because the toolchain contract is the flake, and Nix does not run there.
    name: Distributions on ${{ matrix.os }}
    needs: [gate]
    if: needs.gate.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Set the release version
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: >
          nix develop --command mvn --batch-mode --no-transfer-progress
          --define newVersion="$VERSION"
          --define generateBackupPoms=false
          versions:set
      - name: Build the Ant distribution
        if: runner.os == 'Linux'
        env:
          TIMESTAMP: ${{ needs.gate.outputs.timestamp }}
        run: >
          nix develop --command mvn --batch-mode --no-transfer-progress
          --projects yosql-tooling/yosql-tooling-ant --also-make
          --define project.build.outputTimestamp="$TIMESTAMP"
          install
      - name: Build the CLI distribution
        env:
          TIMESTAMP: ${{ needs.gate.outputs.timestamp }}
        run: >
          nix develop .#native --command mvn --batch-mode --no-transfer-progress
          --projects yosql-tooling/yosql-tooling-cli --also-make
          --define project.build.outputTimestamp="$TIMESTAMP"
          --define skipNativeBuild=false
          install
      - name: Collect the archives
        env:
          # The native binary is named after the platform it was built on, and
          # every job in the matrix produces one. The JVM archive and the Ant
          # distribution are platform-independent, so only one job contributes
          # them — otherwise the merged download would have two jobs writing the
          # same file name.
          PATTERNS: ${{ runner.os == 'Linux' && '*-linux.zip *-jvm.zip *-dist*.zip' || '*-mac.zip' }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for dir in ./yosql-tooling/yosql-tooling-ant/target ./yosql-tooling/yosql-tooling-cli/target; do
            [ -d "$dir" ] || continue
            for pattern in $PATTERNS; do
              find "$dir" -maxdepth 1 -type f -name "$pattern" -exec cp {} dist/ \;
            done
          done
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distributions-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  github:
    # The GitHub release is what central-quota counts, so it is created only
    # after Central accepted the deployment — a failed publish must not consume
    # the organization's monthly budget.
    name: GitHub Release
    needs: [gate, central, gradle, distributions]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the release
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the notes read tags and history
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksum the archives
        working-directory: artifacts
        # One signed manifest rather than one signature per file: the manifest
        # names every archive and its digest, so a single verification covers
        # the whole release and adding an archive cannot silently escape it.
        run: sha256sum ./*.zip > SHA256SUMS
      - id: cosign
        uses: metio/ci/cosign-sign-blob@0b7421952e03e7be2aab6ea5ea10721609d12aac # 2026.8.2070928
        with:
          file: artifacts/SHA256SUMS
      - id: notes
        uses: metio/ci/release-notes@0b7421952e03e7be2aab6ea5ea10721609d12aac # 2026.8.2070928
        with:
          version: ${{ needs.gate.outputs.version }}
          previous: ${{ needs.gate.outputs.last }}
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
          NOTES: ${{ steps.notes.outputs.file }}
        run: >
          gh release create "$VERSION"
          --target "$GITHUB_SHA"
          --title "$VERSION"
          --notes-file "$NOTES"
          artifacts/*.zip
          artifacts/SHA256SUMS
          artifacts/SHA256SUMS.bundle
