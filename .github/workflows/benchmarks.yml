name: Run Benchmarks

# The website charts code-generation, DAO throughput, and how the DAO scenarios
# compare against another library, per release. The numbers come from the
# released code, so the run happens after the release exists, and the result
# lands as a pull request rather than a push to main.
#
# Each matrix value is the suffix of a module under yosql-benchmarks/ and of the
# JSON that module writes, so adding a comparison is adding a word here.
on:
  release:
    types: [released]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmarks:
    name: Benchmark ${{ matrix.benchmark }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # One pull request per benchmark would race on the same branch, and JMH
      # runs are long enough that a shared runner would skew the numbers anyway.
      max-parallel: 1
      matrix:
        benchmark: [codegen, dao, vs-jdbi]
    permissions:
      contents: write # push the results branch
      pull-requests: write # open the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: metio/ci/breto@d4a165ac035d1fa1a7aee5b27192d0aed9c7a0b0 # 2026.11.1111906
        with:
          registries: github:metio/toolchains
      - id: released
        name: Read the released version
        run: echo "version=$(git describe --abbrev=0 --tags)" >> "$GITHUB_OUTPUT"
      - name: Run the benchmark
        env:
          BENCHMARK: ${{ matrix.benchmark }}
        run: >
          mvn --batch-mode --no-transfer-progress
          --projects "yosql-benchmarks/yosql-benchmarks-$BENCHMARK" --also-make
          --activate-profiles benchmarks
          --define org.slf4j.simpleLogger.log.yosql=warn
          --define skipTests
          verify
      - name: Record the results
        env:
          BENCHMARK: ${{ matrix.benchmark }}
          VERSION: ${{ steps.released.outputs.version }}
        # Two copies on purpose: one keyed by version for the history chart, one
        # under CURRENT for the page that always shows the newest numbers.
        run: |
          set -euo pipefail
          results="./yosql-benchmarks/yosql-benchmarks-${BENCHMARK}/target/benchmark/yosql-benchmarks-${BENCHMARK}.json"
          target="./docs/content/benchmarks/results"
          cp --force "$results" "${target}/yosql-benchmarks-${BENCHMARK}-${VERSION}.json"
          cp --force "$results" "${target}/yosql-benchmarks-${BENCHMARK}-CURRENT.json"
      - name: Open a pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "Record ${{ matrix.benchmark }} benchmarks for ${{ steps.released.outputs.version }}"
          title: "Record ${{ matrix.benchmark }} benchmarks for ${{ steps.released.outputs.version }}"
          body: Measured on the released code by the benchmarks workflow.
          add-paths: docs/content/benchmarks/results/*.json
          branch: benchmarks/${{ matrix.benchmark }}
          delete-branch: true
          base: main
          sign-commits: true
