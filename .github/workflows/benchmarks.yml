name: Run Benchmarks

# The website charts code-generation and DAO throughput per release. The numbers
# come from the released code, so the run happens after the release exists, and
# the result lands as a pull request rather than a push to main.
on:
  release:
    types: [released]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmarks:
    name: Benchmark ${{ matrix.benchmark }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # One pull request per benchmark would race on the same branch, and JMH
      # runs are long enough that a shared runner would skew the numbers anyway.
      max-parallel: 1
      matrix:
        benchmark: [codegen, dao]
    permissions:
      contents: write # push the results branch
      pull-requests: write # open the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-
      - id: released
        name: Read the released version
        run: echo "version=$(git describe --abbrev=0 --tags)" >> "$GITHUB_OUTPUT"
      - name: Run the benchmark
        env:
          BENCHMARK: ${{ matrix.benchmark }}
        run: >
          nix develop --command mvn --batch-mode --no-transfer-progress
          --projects "yosql-benchmarks/yosql-benchmarks-$BENCHMARK" --also-make
          --activate-profiles benchmarks
          --define org.slf4j.simpleLogger.log.yosql=warn
          --define skipTests
          verify
      - name: Record the results
        env:
          BENCHMARK: ${{ matrix.benchmark }}
          VERSION: ${{ steps.released.outputs.version }}
        # Two copies on purpose: one keyed by version for the history chart, one
        # under CURRENT for the page that always shows the newest numbers.
        run: |
          set -euo pipefail
          results="./yosql-benchmarks/yosql-benchmarks-${BENCHMARK}/target/benchmark/yosql-benchmarks-${BENCHMARK}.json"
          target="./yosql-website/content/benchmarks/results"
          cp --force "$results" "${target}/yosql-benchmarks-${BENCHMARK}-${VERSION}.json"
          cp --force "$results" "${target}/yosql-benchmarks-${BENCHMARK}-CURRENT.json"
      - name: Open a pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "Record ${{ matrix.benchmark }} benchmarks for ${{ steps.released.outputs.version }}"
          title: "Record ${{ matrix.benchmark }} benchmarks for ${{ steps.released.outputs.version }}"
          body: Measured on the released code by the benchmarks workflow.
          add-paths: yosql-website/content/benchmarks/results/*.json
          branch: benchmarks/${{ matrix.benchmark }}
          delete-branch: true
          base: main
          sign-commits: true
