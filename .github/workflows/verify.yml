name: Verify
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  maven:
    # Reusable Maven pipeline shared across the metio JVM repos. Named "Maven"
    # so its checks read "Maven / build", "Maven / javadoc". `mvn verify` at the
    # root covers the whole reactor — generator, tooling, the Ant/CLI/Maven
    # examples and the benchmarks — so the frontends are exercised by building
    # the projects that consume them.
    name: Maven
    uses: metio/ci/.github/workflows/maven.yml@0b7421952e03e7be2aab6ea5ea10721609d12aac # 2026.8.2070928
  gradle:
    # The Gradle example is not a Maven module, so the reactor never reaches it.
    # Building it is the only check that the Gradle plugin's DSL still matches
    # the configuration model the generator produces.
    name: Gradle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Install the tooling the Gradle plugin builds on
        run: >
          nix develop --command mvn --batch-mode --no-transfer-progress
          --projects yosql-tooling/yosql-tooling-dagger,yosql-examples/yosql-examples-common
          --also-make install
      - name: Build and run the Gradle example
        working-directory: ./yosql-examples/yosql-examples-gradle
        run: nix develop --command ./gradlew build run
  native:
    # Reflection-free generated code is the reason to prefer YoSQL to an ORM
    # under native image, and a claim nobody can check is worth nothing. The JVM
    # suite cannot check it: reflection the JVM resolves at runtime simply is
    # not there once the image is closed, and the failure surfaces on the code
    # path that needed it rather than at build time. So this job compiles
    # generated mapping code into a binary and runs it against a real Postgres,
    # asserting the values that come back. Its own devShell carries GraalVM,
    # which the other jobs do not download.
    name: Native image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Install the tooling the examples generate with
        run: >
          nix develop --command mvn --batch-mode --no-transfer-progress
          --projects yosql-tooling/yosql-tooling-maven --also-make
          --define skipTests install
      - name: Build the CLI native image
        run: >
          nix develop .#native --command mvn --batch-mode --no-transfer-progress
          --projects yosql-tooling/yosql-tooling-cli --also-make
          --define skipNativeBuild=false verify
      - name: Run the CLI binary
        run: ./yosql-tooling/yosql-tooling-cli/target/yosql --help
      - name: Build a native image of generated mapping code
        # --no-fallback: an image that needed an unregistered reflective lookup
        # fails here rather than quietly shipping a binary that starts a JVM.
        run: >
          nix develop .#native --command mvn --batch-mode --no-transfer-progress
          --projects yosql-examples/yosql-examples-native
          --activate-profiles native-image
          --define skipTests package
      - name: Run generated mapping code against Postgres, natively
        env:
          DATABASE_URL: jdbc:postgresql://127.0.0.1:5599/readings
          DATABASE_USER: yosql
        # A throwaway cluster from the flake's Postgres — no daemon, no container
        # runtime, no network. The binary asserts every value it reads back: a
        # UUID, an enum out of text, a value object built from two columns, and a
        # timestamp that is NULL are each a separate way the mapping could have
        # been resolved at runtime instead of at build time.
        run: |
          nix develop .#native --command initdb --pgdata=pgdata --username=yosql --auth=trust --no-sync
          nix develop .#native --command pg_ctl --pgdata=pgdata --wait --log=pg.log \
            --options="-p 5599 -c listen_addresses=127.0.0.1 -c unix_socket_directories=/tmp" start
          nix develop .#native --command psql --host=127.0.0.1 --port=5599 --username=yosql \
            --dbname=postgres --command="create database readings"
          # Through the devShell: the binary's dynamic loader lives in the nix
          # store, and so does the Postgres it talks to.
          nix develop .#native --command \
            ./yosql-examples/yosql-examples-native/target/yosql-native-proof
  reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - run: nix develop --command ci-reuse
  yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - run: nix develop --command ci-yaml
  github-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      # shellcheck rides in the devShell, so actionlint lints run: blocks too.
      - run: nix develop --command ci-actionlint
  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - run: nix develop --command ci-markdown
  typos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - run: nix develop --command ci-typos
  website:
    # A broken shortcode or a dead internal link fails the same way a broken
    # test does. Hugo reads the generated configuration reference, so the site
    # only builds after the Maven side has produced it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The theme is a submodule; without it Hugo has no layouts at all.
          submodules: recursive
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-
      - name: Generate the configuration reference
        run: >
          nix develop --command mvn --batch-mode --no-transfer-progress
          --projects docs --also-make --define skipTests install
      - name: Build the site
        env:
          YOSQL_RELEASE: 0.0.0
        run: >
          nix develop --command hugo --minify --printI18nWarnings
          --printPathWarnings --printUnusedTemplates --source docs
      - name: Check the links
        run: nix develop --command htmltest --conf docs/htmltest.yml
  dco:
    # Developer Certificate of Origin: every commit must carry a Signed-off-by
    # trailer. Skipped for bot-authored PRs (Renovate cannot sign off); a
    # skipped job still satisfies the all-green gate below.
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: metio/ci/dco@0b7421952e03e7be2aab6ea5ea10721609d12aac # 2026.8.2070928
  policy:
    # metio org workflow conventions (conftest/Rego from metio/ci): SHA-pinned
    # uses refs, top-level permissions, timeout-minutes on every job, no
    # untrusted ${{ github.event.* }} interpolation in run: blocks, and — since
    # this repo ships a flake.nix — every tool coming from the devShell.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: metio/ci/policy-check@0b7421952e03e7be2aab6ea5ea10721609d12aac # 2026.8.2070928
  verify:
    # Single required check covering every job above: mark only this one
    # required in branch protection and new jobs are covered automatically.
    name: Verify
    needs: [maven, gradle, native, reuse, yaml, github-actions, markdown, typos, website, dco, policy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify every job succeeded or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          [ -z "$bad" ] || { echo "::error::$bad"; exit 1; }
