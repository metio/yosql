name: Publish Website
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/website.yml
      - docs/**
      - yosql-models/**
      # The site serves the skill, copied in from here while it builds. Without this the published
      # copy keeps whatever it said the last time something under docs/ happened to change.
      - .claude/skills/yosql/**
permissions:
  contents: read
jobs:
  website:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the built site to the gh-pages branch
    env:
      PROJECT_URL: yosql.projects.metio.wtf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the version banner reads the newest tag
          # The theme is a submodule; without it Hugo has no layouts at all.
          submodules: recursive
      - uses: metio/nix-devshell@1976169d4c51b321be318ade369ccf689849f9f0 # 2026.7.6091757
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-
      - id: released
        name: Read the newest release
        # The site quotes a version consumers can actually resolve, so it takes
        # the newest tag rather than the development version in the POMs.
        run: echo "version=$(git describe --abbrev=0 --tags)" >> "$GITHUB_OUTPUT"
      - name: Set the documented version
        env:
          VERSION: ${{ steps.released.outputs.version }}
        run: >
          nix develop --command mvn --batch-mode --no-transfer-progress
          --define newVersion="$VERSION"
          --define generateBackupPoms=false
          versions:set
      - name: Generate the configuration reference
        run: >
          nix develop --command mvn --batch-mode --no-transfer-progress
          --projects docs --also-make --define skipTests install
      - name: Build the site
        env:
          YOSQL_RELEASE: ${{ steps.released.outputs.version }}
        run: >
          nix develop --command hugo --minify --printI18nWarnings
          --printPathWarnings --printUnusedTemplates --source docs
      - name: Check the links
        run: nix develop --command htmltest --conf docs/htmltest.yml
      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/public
          force_orphan: true
          cname: ${{ env.PROJECT_URL }}
