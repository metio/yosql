name: Publish Website
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/website.yml
      - docs/**
      - yosql-models/**
      # The site serves the skill, copied in from here while it builds. Without this the published
      # copy keeps whatever it said the last time something under docs/ happened to change.
      - .claude/skills/yosql/**
  pull_request:
    paths:
      - .github/workflows/website.yml
      - docs/**
      - yosql-models/**
      - .claude/skills/yosql/**
permissions:
  contents: read
jobs:
  website:
    name: Website
    uses: metio/ci/.github/workflows/hugo.yml@4ffe6343c7dad75502de503165b853f1959afc8c # 2026.11.21090200
    permissions:
      contents: write
    with:
      source: docs
      # The site quotes the newest release, a version consumers can actually
      # resolve, and the configuration reference is generated by the docs module.
      prepare: |
        version="$(git describe --abbrev=0 --tags)"
        echo "YOSQL_RELEASE=${version}" >> "$GITHUB_ENV"
        mvn --batch-mode --no-transfer-progress --define newVersion="${version}" --define generateBackupPoms=false versions:set
        mvn --batch-mode --no-transfer-progress --projects docs --also-make --define skipTests install
      cname: yosql.projects.metio.wtf
