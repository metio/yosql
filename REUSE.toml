# SPDX-License-Identifier: 0BSD

version = 1
SPDX-PackageName = "yosql"
SPDX-PackageSupplier = "Sebastian Hoß <seb@xn--ho-hia.de>"
SPDX-PackageDownloadLocation = "https://github.com/metio/yosql"

# JSON carries no comment syntax. renovate.json follows Renovate's fixed schema,
# flake.lock is nix-generated, the benchmark results are JMH output, and the
# native-image configuration is read by GraalVM to a fixed schema.
[[annotations]]
path = [".github/renovate.json", "flake.lock", "docs/content/benchmarks/results/**",
        "yosql-tooling/yosql-tooling-cli/src/main/resources/META-INF/native-image/**"]
precedence = "override"
SPDX-FileCopyrightText = "The yosql Authors"
SPDX-License-Identifier = "0BSD"

# Dotfiles and metadata whose formats either forbid comments or would treat one
# as content.
[[annotations]]
path = [".mailmap", "LICENSE", "yosql-tooling/yosql-tooling-cli/src/assembly/licenseHeaderFile"]
precedence = "override"
SPDX-FileCopyrightText = "The yosql Authors"
SPDX-License-Identifier = "0BSD"

# Hugo reads the front matter from the first line of a content file, and the
# generator's Mustache templates render into content files, so a header at the
# top of either is content rather than metadata.
[[annotations]]
path = [
  "docs/archetypes/**",
  "docs/content/**",
  "yosql-models/yosql-models-generator/src/main/resources/*.md",
  ".claude/skills/**",
]
precedence = "override"
SPDX-FileCopyrightText = "The yosql Authors"
SPDX-License-Identifier = "0BSD"


# IDE settings, shared so everyone's formatter agrees. XML that IntelliJ
# rewrites wholesale, dropping anything it did not put there.
[[annotations]]
path = ".idea/**"
precedence = "override"
SPDX-FileCopyrightText = "The yosql Authors"
SPDX-License-Identifier = "0BSD"

# The Gradle wrapper is Gradle's own, shipped verbatim so a checkout can build
# without Gradle installed.
[[annotations]]
path = ["**/gradle/wrapper/gradle-wrapper.jar", "**/gradle/wrapper/gradle-wrapper.properties", "**/gradlew", "**/gradlew.bat"]
precedence = "override"
SPDX-FileCopyrightText = "Gradle Inc."
SPDX-License-Identifier = "Apache-2.0"
